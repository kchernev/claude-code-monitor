<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Code Monitor</title>
<link rel="stylesheet" href="/static/style.css?v=__V__">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ffffff'/><g fill='none' stroke='%2317181c' stroke-width='2.6' stroke-linecap='round'><path d='M6.5 16h5.5'/><path d='M12 16c4.6 0 3.7-8 8.2-8'/><path d='M12 16h13'/><path d='M12 16c3.7 0 2.8 6.4 6.5 6.4'/></g><circle cx='5' cy='16' r='3.4' fill='%2317181c'/><circle cx='21' cy='8' r='2' fill='%2317181c'/><circle cx='26' cy='16' r='2.9' fill='%237b5cfa'/><circle cx='19.5' cy='22.4' r='1.7' fill='%2317181c'/></svg>">
<script>
// Applied before first paint so the page never flashes the wrong theme.
// ?theme=dark|light wins over the stored preference, making links shareable.
(function () {
  var q = new URLSearchParams(location.search).get('theme');
  var t = q || localStorage.getItem('cm.theme');
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>

<div class="frame">
  <!-- ══ Sidebar — the app's chrome. Stays dark in both themes. ══ -->
  <aside class="side">
    <a class="logo" href="#/overview" aria-label="Claude Code Monitor — dashboard">
      <span class="lm" aria-hidden="true">
        <svg width="21" height="19" viewBox="0 0 34 32">
          <g fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
            <path d="M7 16h6"/><path d="M13 16c5 0 4-9 9-9"/><path d="M13 16h15"/>
            <path d="M13 16c4 0 3 7 7 7"/></g>
          <circle cx="5" cy="16" r="3.8" fill="currentColor"/>
          <circle cx="23" cy="7" r="2.2" fill="currentColor"/>
          <circle cx="29" cy="16" r="3.2" fill="#7b5cfa"/>
          <circle cx="21" cy="23" r="1.8" fill="currentColor"/>
        </svg>
      </span>
      <span class="wm"><b>Claude Code Monitor</b><span>Agent telemetry</span></span>
    </a>

    <div class="mm" id="mm-main">Main menu</div>
    <nav class="nav" aria-labelledby="mm-main">
      <a href="#/overview"><i class="tick"></i><span class="nic" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.8" y="1.8" width="5.4" height="5.4" rx="1.6" fill="currentColor"/><rect x="8.8" y="1.8" width="5.4" height="5.4" rx="1.6" fill="currentColor" opacity=".45"/><rect x="1.8" y="8.8" width="5.4" height="5.4" rx="1.6" fill="currentColor" opacity=".45"/><rect x="8.8" y="8.8" width="5.4" height="5.4" rx="1.6" fill="currentColor" opacity=".45"/></svg>
        </span>Dashboard</a>
      <a href="#/sessions"><i class="tick"></i><span class="nic" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="15" height="15"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4.5h11"/><path d="M2.5 8h11"/><path d="M2.5 11.5h7"/></g></svg>
        </span>Sessions<span class="badge" id="liveBadge" hidden>0</span></a>
      <a href="#/agents"><i class="tick"></i><span class="nic" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="4" cy="8" r="2" fill="currentColor"/><circle cx="12" cy="4.2" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="11.8" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-width="1.4" fill="none"><path d="M6 7.2 10.2 4.9"/><path d="M6 8.8l4.2 2.3"/></g></svg>
        </span>Agents</a>
      <a href="#/workflows"><i class="tick"></i><span class="nic" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="15" height="15"><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3.5h6.5"/><path d="M3 8h10"/><path d="M3 12.5h5"/></g></svg>
        </span>Workflows</a>
      <a href="#/git"><i class="tick"></i><span class="nic" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="15" height="15"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="4.5" cy="3.6" r="1.7"/><circle cx="4.5" cy="12.4" r="1.7"/><circle cx="11.5" cy="5.6" r="1.7"/><path d="M4.5 5.3v5.4"/><path d="M11.5 7.4c0 2.6-4.2 1.6-5.6 3.5"/></g></svg>
        </span>Git</a>
      <a href="#/cost"><i class="tick"></i><span class="nic" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 2v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10.8 5c-.7-.9-1.7-1.3-2.9-1.3-1.7 0-2.9.8-2.9 2.1 0 3 5.9 1.4 5.9 4.4 0 1.4-1.3 2.2-3 2.2-1.3 0-2.4-.5-3.1-1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>Cost</a>
      <a href="#/tools"><i class="tick"></i><span class="nic" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M10.6 2.4a3.4 3.4 0 0 0-3.2 4.5L2.6 11.7a1.5 1.5 0 1 0 2.1 2.1l4.8-4.8a3.4 3.4 0 0 0 4.2-4.4l-2 2-1.9-.5-.5-1.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </span>Tools</a>
    </nav>

    <div class="oth">
      <div class="mm">Others</div>
      <button class="dm" id="themeBtn" role="switch" aria-checked="false"
        aria-label="Dark mode">
        <span class="nic" aria-hidden="true">◐</span>Dark mode
        <span class="sw2" aria-hidden="true"><i></i></span>
      </button>
      <button class="dm" id="reloadBtn" aria-label="Re-scan transcripts">
        <span class="nic" aria-hidden="true">↻</span>Re-scan transcripts
      </button>
      <div class="privacy">Reading <code>~/.claude</code> — transcripts never leave
        this machine.</div>
    </div>
  </aside>

  <main id="view">
    <div class="center"><span class="spin"></span> Reading transcripts…</div>
  </main>
</div>

<div class="tip" id="tip" role="status"></div>
<script src="/static/app.js?v=__V__"></script>
</body>
</html>
